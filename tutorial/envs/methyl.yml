# Chapters 01-06 and 08. Only directly-used packages are listed --
# conda resolves the dependency tree from these.
#
# One constraint is deliberate:
#   r-base=4.5   the newest R that bioconda builds this whole Bioconductor
#                stack for. Every bioconductor-* package below has an r45
#                build, which is Bioconductor 3.22.
#
# No matrixStats pin is needed at this generation. The old `r-matrixstats=1.0`
# pin worked around MatrixGenerics passing `useNames = NA`, an argument
# matrixStats made defunct in 1.2.0; MatrixGenerics 1.13.1 changed that default
# to TRUE and shipped in Bioconductor 3.18, so current matrixStats is correct
# here.
#
# methylGSA is deliberately NOT in this file. bioconda's newest build is
# 1.16.0 for R 4.2, so keeping it would hold this environment a generation
# back. It has its own environment in envs/methylgsa.yml, used only by that
# one section of chapter 08.
#
# knowYourCG and ENmix ARE in this file, as of the R 4.5 generation. They were
# left out when the stack was pinned at R 4.2/Bioc 3.16, where knowYourCG did
# not exist (it enters at Bioc 3.18) and neither had a usable build. At
# r-base=4.5 both solve into this environment alongside everything else --
# verified by building it -- so chapter 08's KYCG enrichment and its comb-p
# DMR call no longer need a second environment. methylGSA remains the one
# section that does.
#
# Everything else floats, so the solver can do its job on your platform.
name: ewas-methyl
channels:
  - conda-forge
  - bioconda
#   r-lattice<0.23   lattice 0.23 stopped exporting `parallel`, which
#                    methylumi 2.56.0 still imports -- so with current lattice,
#                    `library(wateRmelon)` fails to load at all (methylumi is
#                    one of its dependencies). 0.22 still exports it. No chapter
#                    loads wateRmelon directly, so this breaks nothing in the
#                    rendered tutorial, but the package should work if a reader
#                    reaches for BMIQ as chapter 02 suggests.
dependencies:
  - r-base=4.5
  - r-lattice<0.23

  # array I/O and preprocessing
  - bioconductor-minfi
  - bioconductor-illuminaio
  - bioconductor-illuminahumanmethylationepicmanifest
  - bioconductor-illuminahumanmethylationepicanno.ilm10b4.hg19
  - bioconductor-watermelon
  - bioconductor-geoquery
  - bioconductor-biobase

  # cell composition
  - bioconductor-flowsorted.blood.epic
  - bioconductor-genefilter

  # batch effects, association testing, inflation
  - bioconductor-sva
  - bioconductor-limma
  - bioconductor-bacon

  # annotation and enrichment
  - bioconductor-sesame
  - bioconductor-sesamedata
  - bioconductor-knowyourcg
  - bioconductor-genomicranges
  - bioconductor-rtracklayer
  - bioconductor-missmethyl
  - bioconductor-enmix

  # data handling, figures, rendering
  - r-data.table
  - r-r.utils          # fread() needs it to decompress .gz; otherwise only arrives via GEOquery
  - r-jsonlite         # chapter 08 queries the UCSC API for the HGNC track
  - r-ggplot2
  - r-knitr
  - r-dt
  - quarto
