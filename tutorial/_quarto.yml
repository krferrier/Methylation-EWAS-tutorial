              - text: "8. Meta-analyzing with METAL"
                href: 07_pipeline.qmd#sec-meta
              - text: "9. Reading the run as a whole"
                href: 07_pipeline.qmd#sec-reading
              - text: "10. Scaling up"
                href: 07_pipeline.qmd#sec-scaling
          - section: "Functional annotation & region-level analysis"
            href: 08_annotation.qmd
            contents:
              - text: "Part 1 — CpG-level annotation"
                href: 08_annotation.qmd#part-1
              - text: "Part 2 — Region-level analysis (DMRs)"
                href: 08_annotation.qmd#part-2
              - text: "Part 3 — Pathway, trait & enrichment"
                href: 08_annotation.qmd#part-3

format:
  html:
    theme:
      - cosmo
      - theme.scss
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    df-print: paged
    fig-width: 8
    fig-height: 5
    embed-resources: true
    fig-dpi: 200

bibliography: references.bib
link-citations: true

execute:
  warning: false
  message: false
  cache: false
